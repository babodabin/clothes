<title>옷장 v0.5</title>
<style>
:root{
  --bg:#EEF0EC; --ink:#1E2320; --sub:#6B736D; --line:#CDD2CC;
  --card:#FFFFFF; --ok:#2F7A4F; --no:#B3412E; --accent:#34495E; --cp:#C4302B;
}
@media (prefers-color-scheme:dark){
  :root{ --bg:#151816; --ink:#E6E9E5; --sub:#98A09A; --line:#2E3430; --card:#1E2320; --accent:#9DB3C9; --cp:#E0645D; }
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);
  font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  -webkit-tap-highlight-color:transparent;
  padding-top:env(safe-area-inset-top,0px)}
header{display:flex;align-items:baseline;gap:10px;padding:16px 18px 6px}
h1{margin:0;font-size:26px;font-weight:800;letter-spacing:-0.5px}
.ver{font-size:13px;color:var(--sub)}
main{padding:6px 12px calc(90px + env(safe-area-inset-bottom,0px))}
.hint{font-size:14px;line-height:1.55;color:var(--sub);margin:6px 6px 14px}
button,a.btn,select{font:inherit;font-size:14px;border:1px solid var(--line);background:transparent;
  color:var(--ink);border-radius:10px;padding:8px 12px;text-decoration:none;display:inline-block}
button.main{background:var(--accent);color:var(--card);border-color:var(--accent)}
button.cp{background:var(--cp);color:#fff;border-color:var(--cp)}
button.danger{color:var(--no)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.name{font-size:17px;font-weight:700}
.small{font-size:12px;color:var(--sub);word-break:break-all}
input,textarea{width:100%;font:inherit;font-size:16px;padding:10px;border-radius:10px;
  border:1px solid var(--line);background:var(--card);color:var(--ink)}
textarea{min-height:60px;resize:vertical}
label{display:block;font-size:13px;color:var(--sub);margin:14px 0 6px}
/* chips */
.chips{display:flex;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding:2px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;font-size:14px;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--card);font-weight:700}
.chips.wrap{flex-wrap:wrap;overflow:visible}
.inChip{display:flex;gap:6px;margin-bottom:6px}
.pv{font-size:13px;color:var(--sub);margin-top:4px;min-height:18px}
/* tabs */
#tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
#tabs button{flex:1;border:0;border-radius:0;padding:14px 0;font-size:15px;color:var(--sub)}
#tabs button.on{color:var(--ink);font-weight:700}
/* closet bar */
.closets{display:flex;gap:6px;overflow-x:auto;margin:0 -12px 10px;padding:2px 12px 4px;scrollbar-width:none}
.closets::-webkit-scrollbar{display:none}
.views{display:flex;gap:4px;margin-left:auto}
.views button{padding:6px 9px;font-size:13px}
.views button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
/* site hero grid */
.siteGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.siteCard{position:relative;aspect-ratio:3/4;border-radius:16px;overflow:hidden;background:var(--line)}
.siteCard img{width:100%;height:100%;object-fit:cover;display:block;filter:grayscale(1) contrast(1.1) brightness(.92)}
.siteCard .ov{position:absolute;left:0;right:0;bottom:0;padding:10px 12px 12px;background:linear-gradient(180deg,rgba(0,0,0,0),rgba(0,0,0,.78))}
.siteCard .ov .nm{color:#fff;font-size:15px;font-weight:800;letter-spacing:-.2px}
.siteCard .ov .nb{display:inline-block;font-size:9px;color:#fff;background:var(--cp);border-radius:5px;padding:1px 5px;margin-left:5px;vertical-align:middle;font-weight:700}
.siteMgr{margin-top:2px}
.siteMgr summary{font-size:13px;color:var(--sub);padding:10px 4px;cursor:pointer;list-style:none}
.siteMgr summary::-webkit-details-marker{display:none}
/* grid */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;position:relative}
.card .ph{aspect-ratio:3/4;background:var(--line);display:flex;align-items:center;justify-content:center;color:var(--sub);font-size:13px}
.card .ph img{width:100%;height:100%;object-fit:cover}
.card .tx{padding:9px 10px 11px}
.card .nm{font-size:14px;font-weight:700;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.card .pr{font-size:14px;margin-top:2px}
.tag{display:inline-block;font-size:11px;color:var(--cp);border:1px solid var(--cp);border-radius:6px;padding:1px 5px;margin-top:5px}
.grid.v-l{grid-template-columns:1fr;gap:14px}
.grid.v-l .ph{aspect-ratio:auto;min-height:200px}
.grid.v-l .ph img{height:auto;object-fit:contain}
.grid.v-l .tx{padding:12px 14px 14px}
.grid.v-l .nm{font-size:17px;white-space:normal}
.grid.v-l .pr{font-size:16px}
.grid.v-s{grid-template-columns:repeat(3,1fr);gap:6px}
.grid.v-s .card{border-radius:10px}
.grid.v-s .tx{position:absolute;left:0;right:0;bottom:0;padding:3px 6px;background:rgba(0,0,0,.55)}
.grid.v-s .nm,.grid.v-s .small,.grid.v-s .tag{display:none}
.grid.v-s .pr{font-size:12px;color:#fff;margin:0}
.line{display:flex;gap:10px;align-items:center}
.thumb{width:62px;height:80px;border-radius:8px;object-fit:cover;background:var(--line);flex:none}
.listRow{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);
  border-radius:12px;padding:8px;margin-bottom:8px}
/* overlays */
.over{position:fixed;inset:0;background:var(--bg);display:none;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.over.show{display:flex}
#viewer{z-index:20}
#sheet{z-index:30}
.bar{display:flex;align-items:center;gap:6px;padding:8px 10px;border-bottom:1px solid var(--line);flex:none}
.bar .t{flex:1;font-weight:700;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.bar button,.bar a.btn{padding:7px 10px;font-size:13px}
#sAct{display:none;padding:7px 16px;font-size:15px}
#frame{flex:1;width:100%;border:0;background:#fff}
#vtop{display:none;flex:none;padding:10px;border-bottom:1px solid var(--line);background:var(--card)}
#viewer.split #vtop{display:block}
#sheetBody{flex:1;overflow:auto;padding:14px 14px 60px;-webkit-overflow-scrolling:touch}
.big{width:100%;max-height:420px;object-fit:contain;border-radius:12px;background:var(--line);display:block}
.formPh{width:100%;max-height:300px;object-fit:contain;border-radius:12px;background:var(--line);display:block}
table.f{width:100%;border-collapse:collapse;margin:12px 0}
table.f td{padding:7px 4px;border-bottom:1px solid var(--line);font-size:15px;vertical-align:top}
table.f td:first-child{color:var(--sub);width:70px;font-size:13px}
/* compare */
.cmpWrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -12px;padding:0 12px}
table.cmp{border-collapse:separate;border-spacing:0}
table.cmp th,table.cmp td{min-width:140px;max-width:160px;padding:8px;border-bottom:1px solid var(--line);
  font-size:14px;vertical-align:top;text-align:left;background:var(--card)}
table.cmp th.rl,table.cmp td.rl{min-width:56px;max-width:56px;position:sticky;left:0;z-index:1;
  font-size:12px;color:var(--sub);background:var(--bg)}
table.cmp img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:8px;background:var(--line)}
.up{color:var(--no)} .down{color:var(--ok)}
.origin{border-top:3px solid var(--accent)} .cand{border-top:3px solid var(--cp)}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:10px}
.seg button{flex:1;border:0;border-radius:0;padding:9px 0}
.seg button.on{background:var(--ink);color:var(--bg);font-weight:700}
.grp{font-size:16px;font-weight:700;margin:18px 4px 8px;display:flex;align-items:baseline;gap:6px}
.grp span{font-size:12px;color:var(--sub);font-weight:400}
.citem{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px}
.citem.one{cursor:pointer}
.citem .cn{font-size:15px;font-weight:700}
.citem .cm{font-size:12px;color:var(--sub);margin-top:2px}
.citem .cnote{font-size:13px;color:var(--sub);margin-top:4px;line-height:1.45}
.citem .chips{margin-top:8px}
.badge{display:inline-block;font-size:11px;border:1px solid var(--line);border-radius:6px;padding:1px 6px;color:var(--sub);font-weight:400;vertical-align:middle}
.newb{color:var(--cp);border-color:var(--cp)}
#tabs button{font-size:14px}
</style>
</head>

<header><h1>옷장</h1><span class="ver">v0.5</span></header>
<main id="main"></main>

    data.sites=old.sites.map(s=>({id:uid(),name:s.name,url:s.url,

}

function save(){
  try{ localStorage.setItem(KEY,JSON.stringify(data)); return true; }

/* ---------- 탭 ---------- */
let tab='sites', cmpId='', curCloset='all';
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render();});
function render(){
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));
  ({sites:renderSites,cat:renderCatalog,cart:renderCart,cp:renderCp,cmp:renderCmp})[tab]();

}
const closetName=id=>{ const c=data.closets.find(x=>x.id===id); return c?c.name:''; };

/* ---------- 링크 열기 ---------- */
function hostOf(u){ try{return new URL(u).hostname.replace(/^www\./,'');}catch(e){return '';} }
function siteFor(u){ const h=hostOf(u); return data.sites.find(s=>hostOf(s.url)===h); }
function openUrl(url,title,site){
  const s=site||siteFor(url);
  if(s&&s.mode==='out'){ window.open(url,'_blank'); return; }
  openViewer(url,title||(s?s.name:''),s?s.name:'');
}
const viewer=$('#viewer'), frame=$('#frame');
let viewerSite='', viewerParent='';
function openViewer(url,title,siteName){
  viewer.classList.remove('split'); viewerSite=siteName; viewerParent='';
  $('#vTitle').textContent=title; $('#vOut').href=url;
  $('#vAdd').textContent='장바구니에 담기'; $('#vAdd').className='main';
  frame.src=url; viewer.classList.add('show');
}
$('#vClose').onclick=()=>{ viewer.classList.remove('show'); frame.src='about:blank'; render(); };
$('#vAdd').onclick=()=>{
  if(viewer.classList.contains('split')) pickThenForm('cp',{parent:viewerParent});
  else pickThenForm('item',{site:viewerSite});
};

/* 담기: 누르면 바로 사진 고르기 → 고르면 입력 화면 */
let pending=null;
function pickThenForm(kind,preset){
  pending={kind,preset};
  const f=$('#quickFile'); f.value=''; f.click();
}
$('#quickFile').onchange=async e=>{
  const file=e.target.files[0]; if(!file||!pending) return;
  let photo='';
  try{ photo=await compress(file); }catch(err){ alert('사진을 읽지 못했습니다.'); }
  const p=pending; pending=null;
  openForm(p.kind,null,{...p.preset,photo});
};

/* 쿠팡 나란히 보기 */
let cpEngine='coupang';
function openCoupang(itemId){

  viewerParent=itemId; cpEngine='coupang';
  $('#vTitle').textContent='비슷한 옷 더 싸게 찾기';
  $('#vAdd').textContent='후보 담기'; $('#vAdd').className='cp';

        <div class="name" style="font-size:15px">${esc(it.name)||'이름 없음'}</div>
        <div class="small">${esc(won(it.price))} ${esc(it.site)}</div>

function renderSites(){
  $('#main').innerHTML=`

      <div id="sl"></div>
      <div class="box" style="border-style:dashed">
        <label style="margin-top:0">사이트 이름</label><input id="aName">
        <label>주소</label><input id="aUrl" inputmode="url" autocapitalize="off" placeholder="https://">
        <div class="row" style="margin-top:10px"><button class="main" id="aBtn">사이트 추가</button></div>
      </div>
    </details>`;
  const sg=$('#sg');
  data.sites.forEach((s,i)=>{
    const c=document.createElement('div'); c.className='siteCard';
    c.innerHTML=`<img src="${sitePhoto(s,i)}" loading="lazy" alt="">
      <div class="ov"><div class="nm">${esc(s.name)}${s.isNew?'<span class="nb">NEW</span>':''}</div></div>`;
    c.onclick=()=>openUrl(s.url,s.name,s);
    sg.appendChild(c);
  });
  const sl=$('#sl');
  data.sites.forEach(s=>{
    const d=document.createElement('div'); d.className='box';
    d.innerHTML=`<div class="name">${esc(s.name)} ${s.isNew?'<span class="badge newb">새로 추가 · 앱 안 열림 테스트 필요</span>':''}</div><div class="small" style="margin:3px 0 10px">${esc(s.url)}</div>
      <div class="row">
        <button class="main" data-a="open">열기</button>
        <button data-a="mode">${s.mode==='out'?'사파리로 열림':'앱 안에서 열림'}</button>
        <button data-a="del" class="danger" style="margin-left:auto">삭제</button>
      </div>`;
    d.onclick=e=>{
      const a=e.target.dataset.a; if(!a) return;
      if(a==='open') openUrl(s.url,s.name,s);
      if(a==='mode'){ s.mode=s.mode==='out'?'in':'out'; save(); renderSites(); }
      if(a==='del'&&confirm(s.name+' 사이트를 삭제할까요?')){ data.sites=data.sites.filter(x=>x!==s); save(); renderSites(); }
    };
    sl.appendChild(d);
  });
  $('#aBtn').onclick=()=>{
    const n=$('#aName').value.trim(); let u=$('#aUrl').value.trim();
    if(!n||!u){ alert('이름과 주소를 모두 입력하세요.'); return; }
    if(!/^https?:\/\//.test(u)) u='https://'+u;
    data.sites.push({id:uid(),name:n,url:u,mode:'in'}); save(); renderSites();
  };
}

let catMode='style', catType='바지';
function renderCatalog(){
  const items=CATALOG.filter(i=>i.type===catType);
  const groups=catMode==='style'
    ? STYLES.map(g=>[g,items.filter(i=>i.style===g)])
    : CAT_SITES.map(g=>[g,items.filter(i=>i.site===g)]);
  const itemHtml=it=>{
    const single=it.colors.length===1&&!it.colors[0].c;
    const extra=it.brand!==it.site?' · '+esc(it.brand):'';
    const meta=catMode==='style'?esc(it.site)+extra:esc(it.style)+extra;
    return `<div class="citem ${single?'one':''}" ${single?`data-u="${esc(it.colors[0].u)}" data-n="${esc(it.name)}"`:''}>
      <div class="cn">${esc(it.name)}</div>
      <div class="cm">${meta}</div>
      ${it.note?`<div class="cnote">${esc(it.note)}</div>`:''}
      ${single?'':`<div class="chips wrap">${it.colors.map(c=>`<button class="chip" data-u="${esc(c.u)}" data-n="${esc(it.name+' '+c.c)}">${esc(c.c)}</button>`).join('')}</div>`}
    </div>`;
  };
  $('#main').innerHTML=`
    <div class="seg"><button data-m="style" class="${catMode==='style'?'on':''}">스타일별</button><button data-m="site" class="${catMode==='site'?'on':''}">회사별</button></div>
    <div class="chips" style="margin-bottom:6px"><button class="chip on">바지</button></div>
    <p class="hint" style="margin-top:4px">${CAT_DATE}에 Claude가 사이트를 읽어서 정리한 목록입니다. 이름이나 색을 누르면 상품 페이지가 열립니다. 무신사·머스트잇·유니클로는 첫 화면 기준 일부만 담았고, 그라미치·EQL·쿠팡은 읽을 수 없어 빠져 있습니다.</p>
    ${groups.filter(g=>g[1].length).map(([g,list])=>`<div class="grp">${esc(g)}<span>${list.length}</span></div>${list.map(itemHtml).join('')}`).join('')}`;
  $('#main').querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{ catMode=b.dataset.m; renderCatalog(); });
  $('#main').querySelectorAll('[data-u]').forEach(el=>el.onclick=e=>{ e.stopPropagation(); openUrl(el.dataset.u, el.dataset.n); });
}

/* ---------- 옷장 탭 ---------- */
function cpCount(id){ return data.cp.filter(c=>c.parent===id).length; }
const VIEWS=[['l','크게'],['m','보통'],['s','작게'],['list','목록']];
function renderCart(){
  if(curCloset!=='all'&&curCloset!=='none'&&!data.closets.find(c=>c.id===curCloset)) curCloset='all';
  let items=[...data.items].reverse();
  if(curCloset==='none') items=items.filter(i=>!i.closet||!closetName(i.closet));
  else if(curCloset!=='all') items=items.filter(i=>i.closet===curCloset);
  const hasNone=data.items.some(i=>!i.closet||!closetName(i.closet));
  const tabsHtml=[['all','전체'],...data.closets.map(c=>[c.id,c.name]),...(hasNone?[['none','미분류']]:[])]
    .map(([id,n])=>`<button class="chip ${curCloset===id?'on':''}" data-c="${id}">${esc(n)}</button>`).join('')
    +'<button class="chip" data-c="__manage">＋ 옷장 관리</button>'
    +'<button class="chip" data-c="__mysize">내 사이즈</button>';
  $('#main').innerHTML=`
    <div class="closets">${tabsHtml}</div>
    <div class="row" style="margin:0 0 12px;flex-wrap:nowrap">
      <button class="main" id="addItem" style="flex:none">사진으로 담기</button>
      <span class="small" style="flex:none">${items.length}벌</span>
      <div class="views">${VIEWS.map(([v,n])=>`<button data-v="${v}" class="${data.view===v?'on':''}">${n}</button>`).join('')}</div>
    </div>
    <div id="g"></div>`;
  $('#main').querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{
    if(b.dataset.c==='__manage'){ openClosetManager(); return; }
    if(b.dataset.c==='__mysize'){ openMySize(); return; }
    curCloset=b.dataset.c; renderCart();
  });
  $('#main').querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{ data.view=b.dataset.v; save(); renderCart(); });
  $('#addItem').onclick=()=>pickThenForm('item',{});
  const g=$('#g');
  if(!items.length){ g.innerHTML='<p class="hint">비어 있습니다. 사이트에서 옷을 보다가 <b>장바구니에 담기</b>를 누르거나 <b>사진으로 담기</b>로 넣으세요.</p>'; return; }
  if(data.view==='list'){
    items.forEach(it=>{
      const n=cpCount(it.id);
      const d=document.createElement('div'); d.className='listRow';
      d.innerHTML=`${it.photo?`<img class="thumb" src="${it.photo}">`:'<div class="thumb"></div>'}
        <div style="min-width:0;flex:1"><div class="name" style="font-size:15px">${esc(it.name)||'이름 없음'}</div>
        <div>${esc(won(it.price))}</div>
        <div class="small">${[closetName(it.closet),it.site].filter(Boolean).map(esc).join(' · ')}</div>
        ${n?`<span class="tag">쿠팡 후보 ${n}</span>`:''}</div>`;
      d.onclick=()=>showDetail('item',it.id);
      g.appendChild(d);
    });
    return;
  }
  g.className='grid v-'+data.view;
  items.forEach(it=>{
    const n=cpCount(it.id);
    const c=document.createElement('div'); c.className='card';
    c.innerHTML=`<div class="ph">${it.photo?`<img src="${it.photo}">`:'사진 없음'}</div>
      <div class="tx"><div class="nm">${esc(it.name)||'이름 없음'}</div>
      <div class="pr">${esc(won(it.price))}</div><div class="small">${esc(it.site)}</div>
      ${n?`<span class="tag">쿠팡 후보 ${n}</span>`:''}</div>`;
    c.onclick=()=>showDetail('item',it.id);
    g.appendChild(c);
  });
}

/* 옷장 관리 */
function openClosetManager(){
  $('#sTitle').textContent='옷장 관리'; $('#sAct').style.display='none';
  const draw=()=>{
    $('#sheetBody').innerHTML=`
      <p class="hint" style="margin-top:0">이름을 고치면 바로 저장됩니다. 옷장을 지워도 안에 있던 옷은 <b>미분류</b>로 남습니다.</p>
      ${data.closets.map(c=>`<div class="row" style="flex-wrap:nowrap;margin-bottom:8px">
        <input data-rn="${c.id}" value="${esc(c.name)}">
        <button class="danger" data-del="${c.id}" style="flex:none">삭제</button></div>`).join('')}
      <label>새 옷장</label>
      <div class="row" style="flex-wrap:nowrap"><input id="newCl" placeholder="예: 아우터, 신발"><button class="main" id="addCl" style="flex:none">추가</button></div>`;
    $('#sheetBody').querySelectorAll('[data-rn]').forEach(i=>i.onchange=()=>{
      const c=data.closets.find(x=>x.id===i.dataset.rn); const v=i.value.trim();
      if(c&&v){ c.name=v; save(); } else i.value=c?c.name:'';
    });
    $('#sheetBody').querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{
      const c=data.closets.find(x=>x.id===b.dataset.del); if(!c) return;
      const n=data.items.filter(i=>i.closet===c.id).length;
      if(!confirm(`${c.name} 옷장을 지울까요?`+(n?` (안의 옷 ${n}벌은 미분류로 이동)`:''))) return;
      data.closets=data.closets.filter(x=>x!==c);
      data.items.forEach(i=>{ if(i.closet===c.id) i.closet=''; });
      save(); draw();
    });
    $('#addCl').onclick=()=>{
      const v=$('#newCl').value.trim(); if(!v) return;
      data.closets.push({id:uid(),name:v}); save(); draw();
    };
  };
  draw();
  sheet.classList.add('show'); $('#sheetBody').scrollTop=0;
}

/* 내 사이즈 */
function sizeFitText(o){
  const m=data.mySize; if(!m) return '';
  const parts=[];
  const chk=(v,range,label)=>{ v=+v; if(!v) return;
    if(v<range[0]-2) parts.push(label+' 작을듯');
    else if(v>range[1]+2) parts.push(label+' 클듯');
    else parts.push(label+' 맞음');
  };
  chk(o.waistCm,m.waist,'허리'); chk(o.hipCm,m.hip,'엉덩이'); chk(o.inseamCm,m.inseam,'기장');
  return parts.join(' · ');
}

  $('#sTitle').textContent='내 사이즈'; $('#sAct').style.display='none';

function renderCmp(){
  if(!data.items.length){ $('#main').innerHTML='<p class="hint">옷장에 옷을 먼저 넣으세요.</p>'; return; }
  if(!data.items.find(i=>i.id===cmpId)) cmpId=data.items[data.items.length-1].id;
  const it=data.items.find(i=>i.id===cmpId);
  const cands=data.cp.filter(c=>c.parent===cmpId);
  const cols=[it,...cands];
  const base=Number(it.price);
  const diff=p=>{ if(p===''||p==null||isNaN(p)||it.price===''||isNaN(base)) return '';
    const d=Number(p)-base; if(d===0) return '<div class="small">같음</div>';
    return `<div class="${d>0?'up':'down'}" style="font-size:13px">${d>0?'+':'−'}${Math.abs(d).toLocaleString('ko-KR')}원</div>`; };
  let rows='';
  rows+=`<tr><th class="rl"></th>${cols.map((c,i)=>`<th class="${i?'cand':'origin'}"><div class="small">${i?'쿠팡 후보 '+i:'원래 옷'}</div></th>`).join('')}</tr>`;
  rows+=`<tr><td class="rl">사진</td>${cols.map(c=>`<td>${c.photo?`<img src="${c.photo}">`:'<div class="small">없음</div>'}</td>`).join('')}</tr>`;
  rows+=`<tr><td class="rl">이름</td>${cols.map(c=>`<td><b>${esc(c.name)}</b></td>`).join('')}</tr>`;
  rows+=`<tr><td class="rl">가격</td>${cols.map((c,i)=>`<td>${esc(won(c.price))}${i?diff(c.price):''}</td>`).join('')}</tr>`;
  FIELDS.forEach(f=>{ rows+=`<tr><td class="rl">${f[1]}</td>${cols.map(c=>`<td>${esc(c[f[0]])}</td>`).join('')}</tr>`; });
  rows+=`<tr><td class="rl"></td>${cols.map((c,i)=>`<td><div class="row">${c.url?`<button data-o="${i}">열기</button>`:''}<button data-e="${i}">수정</button></div></td>`).join('')}</tr>`;
  $('#main').innerHTML=`
    <label style="margin-top:0">비교할 옷</label>
    <select id="cmpSel" style="width:100%;margin-bottom:12px">${[...data.items].reverse().map(i=>`<option value="${i.id}" ${i.id===cmpId?'selected':''}>${esc(i.name||'이름 없음')} ${esc(won(i.price))}</option>`).join('')}</select>
    <div class="row" style="margin-bottom:12px"><button class="cp" id="cmpFind">더 싸게 찾기</button>
      <span class="small">후보 ${cands.length}개</span></div>
    <div class="cmpWrap"><table class="cmp">${rows}</table></div>`;
  $('#cmpSel').onchange=e=>{ cmpId=e.target.value; renderCmp(); };
  $('#cmpFind').onclick=()=>openCoupang(cmpId);
  $('#main').querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>{ const c=cols[b.dataset.o]; openUrl(c.url,c.name); });
  $('#main').querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>{ const i=+b.dataset.e; openForm(i?'cp':'item',cols[i],{}); });
}

/* ---------- 상세 ---------- */
const sheet=$('#sheet');
function closeSheet(){ sheet.classList.remove('show'); $('#sAct').style.display='none'; if(!viewer.classList.contains('show')) render(); }
$('#sClose').onclick=closeSheet;
function showDetail(kind,id){
  const arr=kind==='item'?data.items:data.cp; const o=arr.find(x=>x.id===id); if(!o) return;
  const p=kind==='cp'?data.items.find(i=>i.id===o.parent):null;
  $('#sTitle').textContent=kind==='item'?'옷장 옷':'가격비교 후보'; $('#sAct').style.display='none';
  const fit=kind==='cp'?sizeFitText(o):'';
  $('#sheetBody').innerHTML=`
    ${o.photo?`<img class="big" src="${o.photo}">`:''}
    <div class="name" style="margin-top:12px;font-size:20px">${esc(o.name)||'이름 없음'}</div>
    <div style="font-size:17px;margin-top:4px">${esc(won(o.price))}</div>
    <table class="f">
      ${kind==='item'?`<tr><td>옷장</td><td>${esc(closetName(o.closet))||'미분류'}</td></tr><tr><td>사이트</td><td>${esc(o.site)}</td></tr>`
        :`<tr><td>비교 대상</td><td>${p?esc(p.name||'이름 없음'):'없음'}</td></tr>`}
      ${kind==='cp'&&(o.waistCm||o.hipCm||o.inseamCm)?`<tr><td>실측</td><td>${[o.waistCm&&('허리 '+o.waistCm+'cm'),o.hipCm&&('엉덩이 '+o.hipCm+'cm'),o.inseamCm&&('기장 '+o.inseamCm+'cm')].filter(Boolean).join(' / ')}${fit?`<br><b>${esc(fit)}</b>`:''}</td></tr>`:''}
      ${FIELDS.map(f=>`<tr><td>${f[1]}</td><td>${esc(o[f[0]])}</td></tr>`).join('')}
      <tr><td>링크</td><td class="small">${esc(o.url)}</td></tr>
    </table>
    <div class="row">
      ${kind==='item'?'<button class="cp" id="dFind">더 싸게 찾기</button><button class="main" id="dCmp">비교하기</button><button id="dAsk">Claude에게 비슷한 옷 찾기</button>':''}
      ${o.url?'<button id="dOpen">링크 열기</button>':''}
      <button id="dEdit">수정</button>
      <button id="dDel" class="danger">삭제</button>
    </div>`;
  if(kind==='item'){
    $('#dFind').onclick=()=>{ sheet.classList.remove('show'); openCoupang(o.id); };
    $('#dCmp').onclick=()=>{ sheet.classList.remove('show'); cmpId=o.id; tab='cmp'; render(); };
    $('#dAsk').onclick=()=>{
      const parts=[o.name&&('이름: '+o.name),o.site&&('사이트: '+o.site),o.price&&('가격: '+won(o.price)),
        o.color&&('색상: '+o.color),o.material&&('소재: '+o.material),o.fit&&('핏: '+o.fit),o.url&&('링크: '+o.url)].filter(Boolean);
      const t='옷장에 담은 옷이야.\n'+(parts.length?parts.join('\n'):'(정보 없음, 스크린샷 참고)')+
        '\n무신사·유니클로·H&M·자라·SSF샵에서 비슷한 남자 옷 찾아줘. 이름·가격·링크로 정리해줘.';
      const done=()=>alert('복사됐습니다. Claude 대화창에 붙여넣으세요. 이 옷 스크린샷도 같이 보내면 더 정확하게 찾습니다.');
      if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(done).catch(()=>prompt('아래 내용을 복사하세요',t));
      else prompt('아래 내용을 복사하세요',t);
    };
  }
  if(o.url) $('#dOpen').onclick=()=>{ sheet.classList.remove('show'); openUrl(o.url,o.name); };
  $('#dEdit').onclick=()=>openForm(kind,o,{});
  $('#dDel').onclick=()=>{
    const extra=kind==='item'&&cpCount(o.id)?` (연결된 쿠팡 후보 ${cpCount(o.id)}개는 남고 연결만 풀립니다)`:'';
    if(!confirm('삭제할까요?'+extra)) return;
    if(kind==='item'){ data.items=data.items.filter(x=>x!==o); data.cp.forEach(c=>{ if(c.parent===o.id) c.parent=''; }); }
    else data.cp=data.cp.filter(x=>x!==o);
    save(); closeSheet();
  };
  sheet.classList.add('show'); $('#sheetBody').scrollTop=0;
}

/* ---------- 입력 화면 (쉬운 입력) ---------- */
function compress(file){
  return new Promise((res,rej)=>{
    const r=new FileReader();
    r.onload=()=>{ const img=new Image();
      img.onload=()=>{ const M=720; let w=img.width,h=img.height;
        if(w>M||h>M){ const k=M/Math.max(w,h); w=Math.round(w*k); h=Math.round(h*k); }
        const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
        cv.getContext('2d').drawImage(img,0,0,w,h); res(cv.toDataURL('image/jpeg',0.72)); };
      img.onerror=rej; img.src=r.result; };
    r.onerror=rej; r.readAsDataURL(file);
  });
}
const chipRow=(f,opts,wrap)=>`<div class="chips ${wrap?'wrap':''}">${opts.map(v=>`<button class="chip" data-f="${f}" data-v="${esc(v)}">${esc(v)}</button>`).join('')}</div>`;

function openForm(kind,obj,preset){
  const o=obj?{...obj}:{photo:preset.photo||'',name:'',price:'',url:'',site:preset.site||'',parent:preset.parent||'',
    closet:(curCloset!=='all'&&curCloset!=='none')?curCloset:'',color:'',material:'',fit:'',size:'',memo:'',
    waistCm:'',hipCm:'',inseamCm:''};
  let nameAuto=!o.name, typeSel='';
  $('#sTitle').textContent=(obj?'수정: ':'')+(kind==='item'?'옷장에 담기':'쿠팡 후보 담기');
  const siteOpts=['',...data.sites.map(s=>s.name)];
  if(o.site&&!siteOpts.includes(o.site)) siteOpts.push(o.site);
  $('#sheetBody').innerHTML=`
    <div id="phBox">${o.photo?`<img class="formPh" src="${o.photo}">`:''}</div>
    <div class="row" style="margin-top:8px">
      <button class="main" id="phPick">${o.photo?'사진 바꾸기':'사진 찍기 / 고르기'}</button>
      <button id="phDel" class="danger" style="${o.photo?'':'display:none'}">사진 빼기</button>
    </div>
    <input type="file" id="phFile" accept="image/*" style="display:none">

    ${kind==='item'?`<label>옷장</label>
      <div class="chips wrap">${[['','미분류'],...data.closets.map(c=>[c.id,c.name])].map(([id,n])=>`<button class="chip" data-f="closet" data-v="${id}">${esc(n)}</button>`).join('')}</div>`:''}

    <label>이름 — 아래 종류·색상을 누르면 자동으로 만들어집니다</label>
    <input id="fName" value="${esc(o.name)}" placeholder="예: 레드 니트">
    <div style="margin-top:6px">${chipRow('type',CHIPS.type)}</div>

    <label>가격</label>
    <input id="fPrice" inputmode="numeric" value="${esc(o.price)}" placeholder="숫자만 (예: 128250)">
    <div class="pv" id="pv">${esc(won(o.price))}</div>

    <label>색상</label>
    <input id="f_color" value="${esc(o.color)}">
    <div style="margin-top:6px">${chipRow('color',CHIPS.color)}</div>

    <label>소재 (여러 개 선택 가능)</label>
    <input id="f_material" value="${esc(o.material)}">
    <div style="margin-top:6px">${chipRow('material',CHIPS.material)}</div>

    <label>핏</label>
    <input id="f_fit" value="${esc(o.fit)}">
    <div style="margin-top:6px">${chipRow('fit',CHIPS.fit)}</div>

    <label>사이즈</label>
    <input id="f_size" value="${esc(o.size)}">
    <div style="margin-top:6px">${chipRow('size',CHIPS.size)}</div>

    ${kind==='item'
      ?`<label>사이트</label><select id="fSite" style="width:100%">${siteOpts.map(s=>`<option ${s===o.site?'selected':''}>${esc(s)}</option>`).join('')}</select>`
      :`<label>비교 대상 (옷장 옷)</label><select id="fParent" style="width:100%"><option value="">연결 안 함</option>${[...data.items].reverse().map(i=>`<option value="${i.id}" ${i.id===o.parent?'selected':''}>${esc(i.name||'이름 없음')}</option>`).join('')}</select>
    <label>실측 사이즈 (판매 페이지 사이즈표의 cm, 알면 적기)</label>
    <div class="row" style="flex-wrap:nowrap">
      <input id="f_waistCm" inputmode="numeric" placeholder="허리" value="${esc(o.waistCm)}">
      <input id="f_hipCm" inputmode="numeric" placeholder="엉덩이" value="${esc(o.hipCm)}">
      <input id="f_inseamCm" inputmode="numeric" placeholder="기장" value="${esc(o.inseamCm)}">
    </div>
    <div class="pv" id="sizeFit"></div>`}

    <label>링크 (없어도 됨)</label>
    <div class="row" style="flex-wrap:nowrap"><input id="fUrl" inputmode="url" autocapitalize="off" value="${esc(o.url)}">
      <button id="pasteUrl" style="flex:none">붙여넣기</button></div>

    <label>메모</label><textarea id="f_memo">${esc(o.memo)}</textarea>
    <div class="row" style="margin-top:18px"><button class="${kind==='item'?'main':'cp'}" id="fSave" style="padding:12px 28px;font-size:16px">저장</button></div>`;

  const body=$('#sheetBody');
  const refresh=()=>{
    body.querySelectorAll('.chip[data-f]').forEach(b=>{
      const f=b.dataset.f, v=b.dataset.v; let on=false;
      if(f==='type') on=typeSel===v;
      else if(f==='closet') on=(o.closet||'')===v;
      else{ const cur=$('#f_'+f).value;
        on=MULTI[f]?cur.split(',').map(s=>s.trim()).includes(v):cur===v; }
      b.classList.toggle('on',on);
    });
  };
  const autoName=()=>{
    if(!nameAuto) return;
    $('#fName').value=[$('#f_color').value.trim(),typeSel].filter(Boolean).join(' ');
  };
  body.querySelectorAll('.chip[data-f]').forEach(b=>b.onclick=()=>{
    const f=b.dataset.f, v=b.dataset.v;
    if(f==='type'){ typeSel=typeSel===v?'':v; autoName(); }
    else if(f==='closet'){ o.closet=v; }
    else{
      const inp=$('#f_'+f);
      if(MULTI[f]){ let arr=inp.value.split(',').map(s=>s.trim()).filter(Boolean);
        arr=arr.includes(v)?arr.filter(x=>x!==v):[...arr,v]; inp.value=arr.join(', '); }
      else inp.value=inp.value===v?'':v;
      if(f==='color') autoName();
    }
    refresh();
  });
  ['color','material','fit','size'].forEach(f=>$('#f_'+f).oninput=()=>{ refresh(); if(f==='color') autoName(); });
  $('#fName').oninput=()=>{ nameAuto=!$('#fName').value.trim(); };
  $('#fPrice').oninput=()=>{ const v=$('#fPrice').value.replace(/[^0-9]/g,''); $('#fPrice').value=v; $('#pv').textContent=won(v); };
  if(kind==='cp'){
    const fitCheck=()=>{
      const tmp={waistCm:$('#f_waistCm').value,hipCm:$('#f_hipCm').value,inseamCm:$('#f_inseamCm').value};
      $('#sizeFit').textContent=sizeFitText(tmp)||'실측 사이즈를 적으면 내 사이즈와 맞는지 알려드려요';
    };
    ['waistCm','hipCm','inseamCm'].forEach(f=>$('#f_'+f).oninput=fitCheck);
    fitCheck();
  }
  $('#pasteUrl').onclick=async()=>{
    try{ const t=(await navigator.clipboard.readText()).trim();
      const m=t.match(/https?:\/\/\S+/); if(m) $('#fUrl').value=m[0]; else alert('복사된 링크가 없습니다.'); }
    catch(e){ alert('붙여넣기를 할 수 없습니다. 칸을 길게 눌러 직접 붙여넣으세요.'); }
  };
  $('#phPick').onclick=()=>$('#phFile').click();
  $('#phDel').onclick=()=>{ o.photo=''; $('#phBox').innerHTML=''; $('#phDel').style.display='none'; $('#phPick').textContent='사진 찍기 / 고르기'; };
  $('#phFile').onchange=async e=>{
    const f=e.target.files[0]; if(!f) return;
    try{ o.photo=await compress(f); $('#phBox').innerHTML=`<img class="formPh" src="${o.photo}">`;
      $('#phDel').style.display=''; $('#phPick').textContent='사진 바꾸기'; }
    catch(err){ alert('사진을 읽지 못했습니다. 다른 사진으로 다시 시도하세요.'); }
  };
  const doSave=()=>{
    o.name=$('#fName').value.trim();
    o.price=$('#fPrice').value.replace(/[^0-9]/g,'');
    o.url=$('#fUrl').value.trim();
    if(o.url&&!/^https?:\/\//.test(o.url)) o.url='https://'+o.url;
    FIELDS.forEach(f=>o[f[0]]=$('#f_'+f[0]).value.trim());
    if(kind==='item') o.site=$('#fSite').value;
    else{
      o.parent=$('#fParent').value;
      o.waistCm=$('#f_waistCm').value.trim(); o.hipCm=$('#f_hipCm').value.trim(); o.inseamCm=$('#f_inseamCm').value.trim();
    }
    if(!o.name&&!o.photo){ alert('이름이나 사진 중 하나는 넣어주세요.'); return; }
    const arr=kind==='item'?data.items:data.cp;
    const backup=JSON.stringify(data);
    if(obj){ Object.assign(arr.find(x=>x.id===obj.id),o); }
    else{ o.id=uid(); o.created=Date.now(); arr.push(o); }
    if(!save()){ data=JSON.parse(backup); return; }
    closeSheet();
  };
  $('#fSave').onclick=doSave;
  $('#sAct').onclick=doSave; $('#sAct').style.display='inline-block';
  $('#sAct').className=kind==='item'?'main':'cp';
  refresh();
  sheet.classList.add('show'); $('#sheetBody').scrollTop=0;
}

render();
</script>
